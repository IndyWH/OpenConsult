<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenConsult — Sign in</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  main { max-width: 420px; margin: 0 auto; padding: 2.5rem 1.5rem 1rem; }
  h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600;
       text-align: center; margin: 0 0 1.5rem; }
  form { background: var(--panel); border: 1px solid var(--line);
         border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; }
  h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em;
       color: var(--ink-faint); font-weight: 600; margin: 0 0 .6rem; }
  label { display: block; margin: .6rem 0 .2rem; }
  input, select { width: 100%; }
  form button { margin-top: 1rem; width: 100%; }
</style>
</head>
<body>
<main>
<h1>OpenConsult</h1>

<form id="loginForm">
  <h2>Sign in</h2>
  <label>Username</label><input name="username" autocomplete="username" required>
  <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
  <button class="primary">Sign in</button>
  <div class="err" id="loginErr"></div>
</form>

<form id="regForm">
  <h2>Register</h2>
  <p class="hint">New accounts need the administrator's approval before
  they can sign in — you'll be able to log in once yours is activated.</p>
  <label>Display name</label><input name="display_name" required>
  <label>Username</label><input name="username" required>
  <label>Password (min 8)</label><input name="password" type="password" minlength="8" required>
  <label>Role</label>
  <select name="role">
    <option value="doctor">Doctor</option>
    <option value="receptionist">Receptionist</option>
  </select>
  <button>Register</button>
  <div class="err" id="regErr"></div>
</form>
</main>

<footer class="disclaimer">Research/educational prototype — not a medical device.
Synthetic consultations only. All AI output is a draft until the doctor approves it.</footer>

<script>
async function submit(form, url, errEl) {
  const body = Object.fromEntries(new FormData(form).entries());
  const response = await fetch(url, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await response.json();
  if (response.ok) {
    if (data.pending) {  // registered, awaiting the administrator's approval
      form.reset();
      errEl.style.color = 'var(--green)';
      errEl.textContent = data.message;
      return;
    }
    location.href = '/today'; return;
  }
  errEl.style.color = '';
  errEl.textContent = data.error || 'failed';
}
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault(); submit(e.target, '/api/login', document.getElementById('loginErr'));
});
document.getElementById('regForm').addEventListener('submit', (e) => {
  e.preventDefault(); submit(e.target, '/api/register', document.getElementById('regErr'));
});
</script>
</body>
</html>
