<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation AI — Sign in</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         max-width: 420px; margin: 0 auto; padding: 2rem 1.5rem; }
  .banner { background: #fff3cd; color: #664d03; border: 1px solid #ffe69c;
            border-radius: 8px; padding: .5rem .75rem; font-size: .85rem; margin-bottom: 1.5rem; }
  @media (prefers-color-scheme: dark) {
    .banner { background: #3a3000; color: #ffe69c; border-color: #665c00; }
  }
  h1 { font-size: 1.3rem; }
  form { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: .85rem; margin: .6rem 0 .2rem; opacity: .8; }
  input, select { width: 100%; padding: .45rem .6rem; border-radius: 6px;
                  border: 1px solid #8886; font-size: .95rem; background: transparent; color: inherit; }
  button { margin-top: .9rem; width: 100%; padding: .55rem; border-radius: 7px;
           border: none; background: #1a7f37; color: white; font-size: 1rem; cursor: pointer; }
  .err { color: #d32f2f; font-size: .85rem; margin-top: .5rem; min-height: 1.2em; }
  h2 { font-size: 1rem; opacity: .8; }
</style>
</head>
<body>
<div class="banner">⚠️ Research/educational prototype — not a medical device. Synthetic consultations only.</div>
<h1>Consultation AI</h1>

<form id="loginForm">
  <h2>Sign in</h2>
  <label>Username</label><input name="username" autocomplete="username" required>
  <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
  <button>Sign in</button>
  <div class="err" id="loginErr"></div>
</form>

<form id="regForm">
  <h2>Register (prototype: open registration for demo purposes)</h2>
  <label>Display name</label><input name="display_name" required>
  <label>Username</label><input name="username" required>
  <label>Password (min 8)</label><input name="password" type="password" minlength="8" required>
  <label>Role</label>
  <select name="role">
    <option value="doctor">Doctor</option>
    <option value="receptionist">Receptionist</option>
  </select>
  <button>Register</button>
  <div class="err" id="regErr"></div>
</form>

<script>
async function submit(form, url, errEl) {
  const body = Object.fromEntries(new FormData(form).entries());
  const response = await fetch(url, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (response.ok) { location.href = '/today'; return; }
  errEl.textContent = (await response.json()).error || 'failed';
}
document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault(); submit(e.target, '/api/login', document.getElementById('loginErr'));
});
document.getElementById('regForm').addEventListener('submit', (e) => {
  e.preventDefault(); submit(e.target, '/api/register', document.getElementById('regErr'));
});
</script>
</body>
</html>
