<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenConsult — Consultations</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  a.open { color: var(--ink-soft); }
  tr.voided td { opacity: .55; }
  tr.voided .strike { text-decoration: line-through; }
  .voidreason { font-size: .78rem; color: var(--red); display: block; }
  #purge { margin-top: 1rem; }
  td button, td a.open { margin-right: .25rem; }
  /* Rule 3: a refused control is marked WHERE IT IS, because #err is above a
     table whose rows can be a screen away. Named colours only. */
  .rejected { outline: 2px solid var(--red); }
</style>
</head>
<body>
<div class="wrap">
<h1 class="page">Consultations</h1>
<p class="hint" id="hint">Worklist and archive. Approved consultations are read-only.</p>
<div class="pane">
<table>
  <thead><tr><th>#</th><th>Patient</th><th>Doctor</th><th>Started</th><th>Status</th>
    <th class="audiocol" style="display:none">Audio</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<p class="hint" id="diskTotal" style="display:none"></p>

<div class="err" id="err"></div>
<button id="purge" class="small danger" style="display:none">Purge voided test data…</button>
</div>

<script src="/static/nav.js"></script>
<script>
// =====================================================================
// THE THREE STANDING RULES FOR THIS PAGE
//
//  1. NEVER SWALLOW AN ACTION. Either PERFORM it, or VISIBLY DISABLE the
//     control with the reason attached to the control itself. Never accept a
//     tap, do nothing, and explain it somewhere else on the page.
//     (2026-07-25, after three instances in one evening.)
//
//  2. A CONTROL THAT CAN ACT MUST NOT LOOK AS IF IT CANNOT. Same cost as
//     rule 1 — a tap not taken — from the opposite direction. (2026-07-28,
//     consultation 448: an asked chip turned green, green means finished
//     everywhere else in this app, and the doctor did not re-tap.)
//
//  3. A CONTROL THE DOCTOR MUST REACH MUST BE WHERE THEY ARE LOOKING.
//     (2026-07-25, consultation 447: the Stop control existed the whole time
//     but sat above the chips that trigger it, so it scrolled out of sight
//     exactly when it was needed. Then again on 2026-07-28 in consultation
//     449, in a NEW control — the speaker-count question, rendered inside the
//     scrolling stack where nobody was looking, and never answered.)
//
// ALL THREE ARE AN ACCESSIBILITY REQUIREMENT, NOT A PREFERENCE. The owner is
// dyslexic with ADHD; a quiet explanation placed away from the control he just
// pressed is, for him, no explanation at all. In a consultation room with a
// patient waiting it is no explanation for anyone.
//
// On THIS page rule 3 is what #err offends against: it sits above the table,
// and Void / Unvoid / keep live in rows that can be far down it. The message
// may ACCOMPANY the refusal there; the reason also goes on the control that was
// pressed, which is where the person is looking.
// =====================================================================
let ME = null;
const errEl = document.getElementById('err');

async function act(url, options, control, whatFailed) {
  errEl.textContent = '';
  if (control) { control.classList.remove('rejected'); control.title = ''; }
  let response;
  try {
    response = await fetch(url, options);
  } catch (err) {
    const message = `${whatFailed}: could not reach the server. Nothing was saved.`;
    errEl.textContent = message;
    if (control) { control.classList.add('rejected'); control.title = message; }
    return false;
  }
  if (response.ok) return true;
  let detail = `error ${response.status}`;
  try { detail = (await response.json()).error || detail; } catch (e) { /* no body */ }
  const message = `${whatFailed}: ${detail}`;
  errEl.textContent = message;
  if (control) { control.classList.add('rejected'); control.title = message; }
  return false;
}

function fmtBytes(n) {
  // Decimal units: KB/MB/GB mean 10^3/10^6/10^9. This used to divide by
  // 1024 and call the result MB, which is MiB under an SI label — the
  // same mislabelling /api/monitor/pulse had. Both now agree on the
  // convention. They still report different TOTALS, legitimately: the
  // pulse walks the recordings directory, this page sums only recordings
  // linked to a consultation row.
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' GB';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + ' MB';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + ' KB';
  return n + ' B';
}

async function voidConsultation(cid, control) {
  const reason = prompt(`Void consultation #${cid} — reason (required):`);
  if (reason === null) return;           // the admin cancelled; not a swallow
  if (!reason.trim()) {
    const message = 'A reason is required to void.';
    errEl.textContent = message;
    if (control) { control.classList.add('rejected'); control.title = message; }
    return;
  }
  // The class decides whether this void can ever be reversed here.
  // test_data is the default because it is the common case; a
  // clinical_safety void is irreversible over HTTP by design.
  const clinical = confirm(
    `Reason class for #${cid}.\n\n` +
    `OK  = clinical safety — the record is unsafe (bad transcript, wrong ` +
    `patient, fabricated note). This void CANNOT be undone from this ` +
    `screen; reversal is break-glass on the server shell.\n\n` +
    `Cancel = test data — routine, freely reversible with Unvoid.`);
  if (clinical && !confirm(
      `Confirm: void #${cid} as CLINICAL SAFETY.\n\n` +
      `There is no Unvoid button for this class. Continue?`)) return;
  await act(`/api/admin/consultations/${cid}/void`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason: reason.trim(),
                          reason_class: clinical ? 'clinical_safety' : 'test_data'})
  }, control, `#${cid} not voided`);
  load();
}

const purgeBtn = document.getElementById('purge');

async function purgeVoided() {
  purgeBtn.classList.remove('rejected'); purgeBtn.title = '';
  // Name the numbers before asking. A blind "delete all voided data?" is
  // how the clinical-safety fixture would have been lost.
  errEl.textContent = '';
  const preview = await fetch('/api/admin/purge-preview');
  if (!preview.ok) {
    const message = 'Could not read the purge preview — nothing was deleted.';
    errEl.textContent = message;
    purgeBtn.classList.add('rejected'); purgeBtn.title = message;
    return;
  }
  const {purgeable, protected: guarded} = await preview.json();
  if (!purgeable) {
    alert(guarded
      ? `Nothing to purge.\n\n${guarded} voided consultation(s) are protected as ` +
        `clinical safety and are never purged.`
      : 'Nothing to purge — there are no voided consultations.');
    return;
  }
  const guardLine = guarded
    ? `\n\n${guarded} clinical-safety consultation(s) are PROTECTED and will NOT ` +
      `be purged.` : '';
  if (!confirm(`Permanently DELETE ${purgeable} voided consultation(s), their notes, ` +
      `transcripts, recordings, and any synthetic patients left with no ` +
      `other consultations?${guardLine}\n\nThis cannot be undone.`)) return;
  if (!confirm(`Second confirmation: really hard-delete ${purgeable} voided ` +
      `consultation(s) now?`)) return;
  const response = await fetch('/api/admin/purge-voided', {method: 'POST'});
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const message = 'Nothing purged: ' + (body.error || `error ${response.status}`);
    errEl.textContent = message;
    purgeBtn.classList.add('rejected'); purgeBtn.title = message;
    return;
  }
  alert(`Purged ${body.consultations} consultation(s), ${body.patients} patient(s), ` +
        `${body.audio_files} recording(s).` +
        (body.protected ? `\n\nProtected (clinical safety, not purged): ` +
                          `${body.protected_ids.map(i => '#' + i).join(', ')}.` : ''));
  load();
}

async function load() {
  const me = ME;
  const admin = me.role === 'admin';
  const clinical = me.role === 'doctor' || admin;
  if (!clinical) document.getElementById('hint').textContent =
    'Status overview. Transcripts and notes are restricted to clinical roles.';
  if (admin) {
    document.getElementById('hint').textContent =
      'All consultations, any doctor. Void removes a consultation from working ' +
      'views (with a reason, content kept); purge later hard-deletes voided data.';
    document.getElementById('purge').style.display = '';
  }
  const rows = await (await fetch(admin ? '/api/admin/consultations' : '/api/consultations')).json();
  if (admin) {
    for (const th of document.querySelectorAll('.audiocol')) th.style.display = '';
    const totalBytes = rows.reduce((sum, c) => sum + (c.audio_bytes || 0), 0);
    const withAudio = rows.filter(c => c.audio_bytes != null).length;
    const diskEl = document.getElementById('diskTotal');
    diskEl.style.display = '';
    diskEl.textContent = `Recordings on disk: ${withAudio} file(s), ${fmtBytes(totalBytes)} total. ` +
      'Retention: audio (never transcripts or notes) is deleted after the retention window ' +
      'unless flagged “keep”. Approved consultations are stored as lossless FLAC.';
  }
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const c of rows) {
    const tr = document.createElement('tr');
    if (c.voided_at) tr.className = 'voided';
    const label = c.status === 'queued' ? 'processing (queued)' : c.status.replace('_',' ');
    // esc() on every server value (nav.js): patient_name is typed at the
    // queue form, doctor_name comes from a registered display_name, and
    // void_reason is free text — all three reach other users' sessions.
    const status = c.voided_at
      ? '<span class="chip status voided">voided</span>'
      : `<span class="chip status ${esc(c.status)}">${esc(label)}</span>`;
    const reason = c.voided_at
      ? `<span class="voidreason">voided ${esc(c.voided_at)}${c.voided_by ? ' by ' + esc(c.voided_by) : ''}: ${esc(c.void_reason)}</span>` : '';
    tr.innerHTML =
      `<td>${c.id}</td>` +
      `<td><span class="${c.voided_at ? 'strike' : ''}">${esc(c.patient_name)}</span>${reason}</td>` +
      `<td>${esc(c.doctor_name)}</td><td>${esc(c.started_at)}</td><td>${status}</td>` +
      (admin ? '<td class="audio"></td>' : '') + '<td></td>';
    if (admin) {
      const audioCell = tr.querySelector('.audio');
      if (c.audio_bytes != null) {
        audioCell.append(fmtBytes(c.audio_bytes) + ' ');
        const keep = document.createElement('label');
        keep.className = 'hint';
        keep.title = 'Exempt this recording from the retention sweep';
        const box = document.createElement('input');
        box.type = 'checkbox'; box.style.width = 'auto';
        box.checked = !!c.keep_for_research;
        box.addEventListener('change', async () => {
          await act(`/api/admin/consultations/${c.id}/keep-for-research`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: box.checked})},
            box, `#${c.id}'s retention flag not changed`);
          load();   // reverts the box if the server refused
        });
        keep.append(box, ' keep');
        audioCell.appendChild(keep);
      } else {
        audioCell.textContent = c.audio_deleted_at
          ? `purged ${c.audio_deleted_at} (retention)` : '—';
      }
    }
    const cell = tr.lastElementChild;
    if (clinical && !c.voided_at) {
      const a = document.createElement('a');
      a.className = 'open'; a.href = `/review/${c.id}`; a.textContent = 'open →';
      cell.appendChild(a);
    }
    if (admin) {
      if (c.voided_at) {
        const a = document.createElement('a');
        a.className = 'open'; a.href = `/review/${c.id}`; a.textContent = 'inspect →';
        cell.appendChild(a);
        cell.appendChild(document.createTextNode(' '));
        if (c.void_reason_class === 'clinical_safety') {
          // No button at all for a clinical-safety void. The API refuses
          // it too; this just stops anyone reaching for it.
          const locked = document.createElement('span');
          locked.className = 'hint';
          locked.textContent = 'clinical safety — unvoid is break-glass only';
          cell.appendChild(locked);
        } else {
        const btn = document.createElement('button');
        btn.className = 'small'; btn.textContent = 'Unvoid';
        btn.addEventListener('click', async () => {
          // Show WHY it was voided before allowing the reversal. #70 was
          // unvoided twice because nothing made anyone read this.
          if (!confirm(
              `Consultation #${c.id} was voided${c.voided_at ? ' on ' + c.voided_at : ''}` +
              `${c.voided_by ? ' by ' + c.voided_by : ''} for this reason:\n\n` +
              `    ${c.void_reason || '(no reason recorded)'}\n\n` +
              `Restore it to the working views?`)) return;
          const reason = prompt(`Why are you unvoiding #${c.id}? (required)`);
          if (reason === null) return;
          if (!reason.trim()) {
            const message = 'A reason is required to unvoid.';
            errEl.textContent = message;
            btn.classList.add('rejected'); btn.title = message;
            return;
          }
          await act(`/api/admin/consultations/${c.id}/unvoid`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({reason: reason.trim()})
          }, btn, `#${c.id} not unvoided`);
          load();
        });
        cell.appendChild(btn);
        }
      } else {
        cell.appendChild(document.createTextNode(' '));
        const btn = document.createElement('button');
        btn.className = 'small'; btn.textContent = 'Void…';
        btn.addEventListener('click', () => voidConsultation(c.id, btn));
        cell.appendChild(btn);
      }
    }
    tbody.appendChild(tr);
  }
  if (!rows.length) tbody.innerHTML = '<tr><td colspan="7" class="hint">No consultations yet.</td></tr>';
}

document.getElementById('purge').addEventListener('click', purgeVoided);
document.addEventListener('me-ready', (e) => { ME = e.detail; load(); });
</script>
</body>
</html>
