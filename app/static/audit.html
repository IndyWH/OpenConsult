<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation AI — Audit log</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  table { font-size: .85rem; }
  td { font-variant-numeric: tabular-nums; }
  code { font-size: .8rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<h1 class="page">Audit log</h1>
<div class="pane">
<table>
  <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Subject</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>
<script src="/static/nav.js"></script>
<script>
document.addEventListener('me-ready', async () => {
  const rows = await (await fetch('/api/audit')).json();
  const tbody = document.getElementById('rows');
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.at.slice(0, 19)}</td>` +
      `<td>${r.username || '—'} (${r.role || '—'})</td><td>${r.action}</td>` +
      `<td>${r.subject_type || ''} ${r.subject_id ?? ''}</td>` +
      `<td><code>${r.detail ? JSON.stringify(r.detail) : ''}</code></td>`;
    tbody.appendChild(tr);
  }
});
</script>
</body>
</html>
