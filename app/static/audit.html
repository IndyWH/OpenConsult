<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenConsult — Audit log</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  table { font-size: .85rem; }
  td { font-variant-numeric: tabular-nums; }
  code { font-size: .8rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
<h1 class="page">Audit log</h1>
<div class="pane">
<table>
  <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Subject</th><th>Detail</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>
<script src="/static/nav.js"></script>
<script>
document.addEventListener('me-ready', async () => {
  const rows = await (await fetch('/api/audit')).json();
  const tbody = document.getElementById('rows');
  for (const r of rows) {
    const tr = document.createElement('tr');
    // esc() on every server value (nav.js). JSON.stringify escapes quotes
    // and backslashes but NOT `<`, so a payload inside any audited free
    // text (a void reason, a letter specialty) used to break out of the
    // <code> element — in the tamper-evident record, of all places.
    tr.innerHTML = `<td>${esc(r.at.slice(0, 19))}</td>` +
      `<td>${esc(r.username || '—')} (${esc(r.role || '—')})</td><td>${esc(r.action)}</td>` +
      `<td>${esc(r.subject_type || '')} ${esc(r.subject_id ?? '')}</td>` +
      `<td><code>${esc(r.detail ? JSON.stringify(r.detail) : '')}</code></td>`;
    tbody.appendChild(tr);
  }
});
</script>
</body>
</html>
