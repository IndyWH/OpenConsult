<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation AI — Today</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  form.queue { display: flex; gap: .5rem; margin: .8rem 0; flex-wrap: wrap; }
  td .hint { margin-left: .25rem; }
  td button { margin-right: .25rem; }
</style>
</head>
<body>
<div class="wrap">
<h1 class="page">Today's queue</h1>
<form id="addForm" class="queue" style="display:none">
  <input name="name" placeholder="Patient name (synthetic)" required>
  <input name="age" type="number" placeholder="Age" min="0" max="120" style="width:5.5rem">
  <select name="sex"><option value="">—</option><option>F</option><option>M</option></select>
  <button class="primary">Add to queue</button>
</form>
<form id="walkinForm" class="queue" style="display:none">
  <input name="name" placeholder="Walk-in patient name (synthetic)" required>
  <input name="age" type="number" placeholder="Age" min="0" max="120" style="width:5.5rem">
  <select name="sex"><option value="">—</option><option>F</option><option>M</option></select>
  <button class="primary">Start walk-in consultation</button>
</form>
<p class="hint" id="hint"></p>
<label class="hint" style="display:block;margin-bottom:.5rem">
  <input type="checkbox" id="showClosed" style="width:auto"> Show closed entries (done / cancelled)
</label>
<div class="pane">
<table>
  <thead><tr><th>#</th><th>Patient</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>

<script src="/static/nav.js"></script>
<script>
let me = null;

async function resumeEntry(entryId) {
  const response = await fetch(`/api/queue/${entryId}/resume`);
  if (!response.ok) { refresh(); return; }
  const dest = await response.json();
  location.href = dest.mode === 'review'
    ? `/review/${dest.consultation_id}` : `/live?queue=${dest.entry_id}`;
}

// Concurrency guard: the server refuses to start while another
// consultation is active; offer to resume it instead.
function offerResume(payload) {
  // A refused live slot must say WHAT is holding it. "Something is busy" is
  // unactionable and identical whether the blocker is a colleague mid-
  // consultation or a walk-in abandoned an hour ago — which is exactly what
  // locked the practice out via queue entry 164.
  //
  // The guard itself is untouched: one live consultation at a time is a safety
  // property (two would share the transcriber, and an urgency alarm arriving
  // late under contention is a safety regression). Only the refusal changes.
  if (!payload || !payload.active) {
    // Previously a silent refresh — the tap did nothing and said nothing.
    alert((payload && payload.error)
      || 'Could not start: a live consultation is already in progress.');
    refresh();
    return;
  }
  const a = payload.active;
  const opened = a.added_at ? ` (opened at ${String(a.added_at).slice(11, 16)})` : '';
  if (confirm(`${a.name} is already in consultation${opened}.\n\n` +
              `Resume that consultation?\n\n` +
              `Cancel to stay here — if it was abandoned, use Close on their ` +
              `row in the queue below to free the slot.`)) {
    resumeEntry(a.entry_id);
  } else {
    refresh();
  }
}

async function refresh() {
  const queue = await (await fetch('/api/queue')).json();
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  const canManage = me && (me.role === 'receptionist' || me.role === 'admin');
  const clinical = me && (me.role === 'doctor' || me.role === 'admin');
  // Active entries always visible and first, numbered gaplessly 1..N in
  // queue order (server positions keep gaps when entries close — the
  // displayed number is the human "you're third in line" one). Closed
  // entries sit behind the toggle with no number.
  const isActive = e => e.status === 'waiting' || e.status === 'in_consultation';
  const active = queue.filter(isActive);
  const closed = queue.filter(e => !isActive(e));
  const shown = document.getElementById('showClosed').checked
    ? active.concat(closed) : active;
  let displayNo = 0;
  for (const entry of shown) {
    const tr = document.createElement('tr');
    const demo = [entry.age, entry.sex].filter(Boolean).join(', ');
    // esc() on every server value (nav.js): entry.name is typed at the
    // queue form and renders in the doctor's session, and this table
    // refreshes every 5 s — an unescaped payload re-fired continuously.
    tr.innerHTML = `<td>${isActive(entry) ? ++displayNo : '—'}</td>` +
      `<td>${esc(entry.name)}${demo ? ` <span class="hint">(${esc(demo)})</span>` : ''}</td>` +
      `<td><span class="chip status ${esc(entry.status)}">${esc(entry.status.replace('_',' '))}</span></td>`;
    const actions = document.createElement('td');
    if (canManage && entry.status === 'waiting') {
      for (const [dir, arrow] of [['up','↑'], ['down','↓']]) {
        const b = document.createElement('button');
        b.className = 'small'; b.textContent = arrow;
        b.addEventListener('click', async () => {
          await fetch(`/api/queue/${entry.entry_id}/move?direction=${dir}`, {method:'POST'});
          refresh();
        });
        actions.appendChild(b); actions.appendChild(document.createTextNode(' '));
      }
    }
    if (clinical && entry.status === 'waiting') {
      const b = document.createElement('button');
      b.className = 'primary small'; b.textContent = 'Start consultation';
      b.addEventListener('click', async () => {
        const response = await fetch(`/api/queue/${entry.entry_id}/start`, {method:'POST'});
        if (response.status === 409) { offerResume(await response.json()); return; }
        if (!response.ok) { refresh(); return; }
        const started = await response.json();
        location.href = `/live?queue=${started.entry_id}`;
      });
      actions.appendChild(b);
    }
    if (clinical && entry.status === 'in_consultation') {
      const b = document.createElement('button');
      b.className = 'primary small'; b.textContent = 'Resume';
      b.addEventListener('click', () => resumeEntry(entry.entry_id));
      actions.appendChild(b); actions.appendChild(document.createTextNode(' '));
    }
    if ((canManage || clinical) &&
        (entry.status === 'waiting' || entry.status === 'in_consultation')) {
      const b = document.createElement('button');
      b.className = 'small'; b.textContent = 'Close';
      b.title = 'Close without a consultation (marks the entry cancelled)';
      b.addEventListener('click', async () => {
        if (!confirm(`Close ${entry.name}'s queue entry without a consultation?`)) return;
        await fetch(`/api/queue/${entry.entry_id}/close`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({outcome: 'cancelled'})});
        refresh();
      });
      actions.appendChild(b);
    }
    tr.appendChild(actions);
    tbody.appendChild(tr);
  }
  if (!shown.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="hint">' +
      (queue.length ? 'No active entries.' : 'Queue is empty.') + '</td></tr>';
  }
  if (closed.length && !document.getElementById('showClosed').checked) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="4" class="hint">${closed.length} closed ` +
      'entr' + (closed.length === 1 ? 'y' : 'ies') + ' hidden — tick "Show closed entries" to see them.</td>';
    tbody.appendChild(tr);
  }
}

document.addEventListener('me-ready', (e) => {
  me = e.detail;
  if (me.role === 'receptionist' || me.role === 'admin') {
    document.getElementById('addForm').style.display = '';
    document.getElementById('hint').textContent =
      'Walk-in queue: add patients in arrival order; reorder while waiting.';
  }
  if (me.role === 'doctor' || me.role === 'admin') {
    document.getElementById('walkinForm').style.display = '';
  }
  if (me.role === 'doctor') {
    document.getElementById('hint').textContent =
      'Read-only queue view — click Start on a waiting patient, or use the ' +
      'walk-in form to register and start a consultation in one step.';
  }
  refresh();
  setInterval(refresh, 5000);
});

document.getElementById('showClosed').addEventListener('change', refresh);

document.getElementById('walkinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const response = await fetch('/api/queue/walk-in', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: data.name, age: data.age ? +data.age : null,
                          sex: data.sex || null})});
  if (response.status === 409) { offerResume(await response.json()); return; }
  if (!response.ok) { refresh(); return; }
  const started = await response.json();
  location.href = `/live?queue=${started.entry_id}`;
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  await fetch('/api/queue', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: data.name, age: data.age ? +data.age : null,
                          sex: data.sex || null})});
  e.target.reset();
  refresh();
});
</script>
</body>
</html>
