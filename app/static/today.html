<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultation AI — Today</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         max-width: 780px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.25rem; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .75rem; text-transform: uppercase;
       letter-spacing: .05em; opacity: .6; padding: .4rem .5rem; }
  td { padding: .5rem; border-top: 1px solid #8883; }
  .badge { border-radius: 5px; padding: .1rem .5rem; font-size: .78rem; font-weight: 600; }
  .badge.waiting { background: #8883; }
  .badge.in_consultation { background: #ed6c0233; color: #ed6c02; }
  .badge.done { background: #1a7f3733; color: #1a7f37; }
  .badge.cancelled { background: #d32f2f22; color: #d32f2f; }
  button { padding: .3rem .7rem; border-radius: 6px; border: 1px solid #888;
           background: transparent; color: inherit; cursor: pointer; font-size: .85rem; }
  button.start { background: #1a7f37; border-color: #1a7f37; color: white; }
  form { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
  input, select { padding: .4rem .6rem; border-radius: 6px; border: 1px solid #8886;
                  background: transparent; color: inherit; }
  .hint { font-size: .8rem; opacity: .55; }
</style>
</head>
<body>
<h1>Today's queue</h1>
<form id="addForm" style="display:none">
  <input name="name" placeholder="Patient name (synthetic)" required>
  <input name="age" type="number" placeholder="Age" min="0" max="120" style="width:5.5rem">
  <select name="sex"><option value="">—</option><option>F</option><option>M</option></select>
  <button class="start">Add to queue</button>
</form>
<form id="walkinForm" style="display:none">
  <input name="name" placeholder="Walk-in patient name (synthetic)" required>
  <input name="age" type="number" placeholder="Age" min="0" max="120" style="width:5.5rem">
  <select name="sex"><option value="">—</option><option>F</option><option>M</option></select>
  <button class="start">Start walk-in consultation</button>
</form>
<p class="hint" id="hint"></p>
<table>
  <thead><tr><th>#</th><th>Patient</th><th>Status</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="/static/nav.js"></script>
<script>
let me = null;

async function resumeEntry(entryId) {
  const response = await fetch(`/api/queue/${entryId}/resume`);
  if (!response.ok) { refresh(); return; }
  const dest = await response.json();
  location.href = dest.mode === 'review'
    ? `/review/${dest.consultation_id}` : `/live?queue=${dest.entry_id}`;
}

// Concurrency guard: the server refuses to start while another
// consultation is active; offer to resume it instead.
function offerResume(payload) {
  if (!payload || !payload.active) { refresh(); return; }
  const a = payload.active;
  if (confirm(`${a.name} is already in consultation. Resume that consultation?\n` +
              `(Cancel to stay here — you can Close their entry from the queue.)`)) {
    resumeEntry(a.entry_id);
  } else {
    refresh();
  }
}

async function refresh() {
  const queue = await (await fetch('/api/queue')).json();
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  const canManage = me && (me.role === 'receptionist' || me.role === 'admin');
  const clinical = me && (me.role === 'doctor' || me.role === 'admin');
  for (const entry of queue) {
    const tr = document.createElement('tr');
    const demo = [entry.age, entry.sex].filter(Boolean).join(', ');
    tr.innerHTML = `<td>${entry.position}</td>` +
      `<td>${entry.name}${demo ? ` <span class="hint">(${demo})</span>` : ''}</td>` +
      `<td><span class="badge ${entry.status}">${entry.status.replace('_',' ')}</span></td>`;
    const actions = document.createElement('td');
    if (canManage && entry.status === 'waiting') {
      for (const [dir, arrow] of [['up','↑'], ['down','↓']]) {
        const b = document.createElement('button');
        b.textContent = arrow;
        b.addEventListener('click', async () => {
          await fetch(`/api/queue/${entry.entry_id}/move?direction=${dir}`, {method:'POST'});
          refresh();
        });
        actions.appendChild(b); actions.appendChild(document.createTextNode(' '));
      }
    }
    if (clinical && entry.status === 'waiting') {
      const b = document.createElement('button');
      b.className = 'start'; b.textContent = 'Start consultation';
      b.addEventListener('click', async () => {
        const response = await fetch(`/api/queue/${entry.entry_id}/start`, {method:'POST'});
        if (response.status === 409) { offerResume(await response.json()); return; }
        if (!response.ok) { refresh(); return; }
        const started = await response.json();
        location.href = `/live?queue=${started.entry_id}`;
      });
      actions.appendChild(b);
    }
    if (clinical && entry.status === 'in_consultation') {
      const b = document.createElement('button');
      b.className = 'start'; b.textContent = 'Resume';
      b.addEventListener('click', () => resumeEntry(entry.entry_id));
      actions.appendChild(b); actions.appendChild(document.createTextNode(' '));
    }
    if ((canManage || clinical) &&
        (entry.status === 'waiting' || entry.status === 'in_consultation')) {
      const b = document.createElement('button');
      b.textContent = 'Close';
      b.title = 'Close without a consultation (marks the entry cancelled)';
      b.addEventListener('click', async () => {
        if (!confirm(`Close ${entry.name}'s queue entry without a consultation?`)) return;
        await fetch(`/api/queue/${entry.entry_id}/close`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({outcome: 'cancelled'})});
        refresh();
      });
      actions.appendChild(b);
    }
    tr.appendChild(actions);
    tbody.appendChild(tr);
  }
  if (!queue.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="hint">Queue is empty.</td></tr>';
  }
}

document.addEventListener('me-ready', (e) => {
  me = e.detail;
  if (me.role === 'receptionist' || me.role === 'admin') {
    document.getElementById('addForm').style.display = '';
    document.getElementById('hint').textContent =
      'Walk-in queue: add patients in arrival order; reorder while waiting.';
  }
  if (me.role === 'doctor' || me.role === 'admin') {
    document.getElementById('walkinForm').style.display = '';
  }
  if (me.role === 'doctor') {
    document.getElementById('hint').textContent =
      'Read-only queue view — click Start on a waiting patient, or use the ' +
      'walk-in form to register and start a consultation in one step.';
  }
  refresh();
  setInterval(refresh, 5000);
});

document.getElementById('walkinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const response = await fetch('/api/queue/walk-in', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: data.name, age: data.age ? +data.age : null,
                          sex: data.sex || null})});
  if (response.status === 409) { offerResume(await response.json()); return; }
  if (!response.ok) { refresh(); return; }
  const started = await response.json();
  location.href = `/live?queue=${started.entry_id}`;
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  await fetch('/api/queue', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: data.name, age: data.age ? +data.age : null,
                          sex: data.sex || null})});
  e.target.reset();
  refresh();
});
</script>
</body>
</html>
