# The GitHub check (spec 15.6, D12). On every push to v2, on GitHub's own
# Linux, Windows and macOS machines: install from the lock file, run the
# suite, then start the app, check that it answers, and stop it.
# No secret. Read-only rights. Each outside step is pinned to a commit.

name: check

on:
  push:
    branches: [v2]

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Install from the lock file
        run: uv sync --locked

      - name: Run the suite (a skipped test fails it)
        run: uv run pytest -rs

      - name: Start the app with a temporary data folder, check that it answers, stop it
        run: uv run python .github/scripts/start_check.py
