{% extends "base.html" %}
{% from "_parts.html" import refusal with context %}
{% set title = words.FIRST_RUN_STATEMENT_TITLE %}
{% block main %}
<h1 class="page">{{ words.FIRST_RUN_STATEMENT_TITLE }}</h1>
<form method="post" action="/first-run/statement" class="pane">
  <div class="pane-body">
    <p class="statement">{{ statement }}</p>
    <label class="tick"><input type="checkbox" name="agree" value="yes"> {{ words.STATEMENT_TICK }}</label>
    <button class="primary" id="continue" aria-describedby="continue-refusal">{{ words.CONTINUE }}</button>
    {{ refusal("continue") }}
  </div>
</form>
{% endblock %}
