[project]
name = "consultation-ai"
version = "0.1.0"
description = "AI-assisted medical consultations in Sinhala and English — research/educational prototype"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12",
    "nvidia-cudnn-cu12>=9",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "whisperx>=3.8.5",
]

[tool.uv]
# whisperx pins ctranslate2<4.5, but 4.4's bundled lib fails on WSL2/newer
# glibc ("cannot enable executable stack"). 4.6+ works for both whisperx
# and the live faster-whisper path (cuDNN 9 comes from the nvidia wheels).
override-dependencies = [
    "ctranslate2>=4.6",
    # whisperx 3.8 wants pyannote>=4, whose 3.1-pipeline loader pulls the
    # separately-gated community-1 artifacts. pyannote 3.4 loads
    # speaker-diarization-3.1 directly with the token we have; we call
    # pyannote ourselves in app/finalize.py rather than via whisperx.
    "pyannote-audio==3.4.0",
    # whisperx declares torchcodec but never imports it (audio loads via its
    # own ffmpeg subprocess). torchcodec 0.7 cannot load against Ubuntu
    # 26.04's FFmpeg 8 (needs libavutil 56-59), and its mere presence makes
    # transformers' chunked ASR pipeline crash at import (it probes
    # availability by package metadata, then `import torchcodec` fails) —
    # which broke long-form decoding in scripts/evaluate_sinhala_asr.py.
    # Excluding it makes transformers skip the torchcodec path entirely.
    "torchcodec; sys_platform == 'never'",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "datasets==3.6.0",
    "jiwer>=4",
]
