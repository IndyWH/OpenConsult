[project]
name = "openconsult"
version = "2.0.0.dev0"
description = "Live transcription and decision support for acted consultations. A research and education prototype, never for real patients."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
]

[project.scripts]
openconsult = "openconsult.cli:main"
openconsult-bench = "openconsult.bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
