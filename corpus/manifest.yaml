# Guideline corpus manifest — the committed record of what the local corpus
# contains and where every document came from.
#
# The corpus files themselves are NOT committed (they are third-party
# copyrighted content, fetched locally for research/educational use only —
# never committed, never redistributed). Rebuild the corpus and the
# pgvector store with:
#
#     uv run python scripts/ingest_guidelines.py
#
# Validation convention (the NG28 lesson — NICE URLs change content
# silently, and remembered guideline codes go stale; NG51 and NG138 were
# both found replaced when this corpus was expanded):
#   - expect_title: substring that must appear in every fetched page's
#     <title> (case-insensitive) — catches wrong codes and replaced
#     guidelines at fetch time.
#   - expected_queries: 2-3 retrieval queries per source; after ingestion
#     each must retrieve a chunk from its source within the global top
#     ranks at similarity above the refusal floor. A source that downloads
#     but fails its expected queries fails ingestion loudly — chunk counts
#     alone prove nothing about retrievability.
#   - Redirects to a different page are fetch failures (NICE redirects
#     retired chapter URLs to overview stubs instead of 404ing).
#
# Coverage (v2026-07-24.1): expanded from the original mock-script scope
# to the presentations external demo users are likely to record — common
# UK primary-care topics, plus dengue for the Sinhala scripts. Where no
# NICE guideline exists, NICE CKS topics fill in (iron-deficiency anaemia,
# adult eczema management, giant cell arteritis — the CKS GCA topic is
# written from the BSR guideline; the BSR full text on academic.oup.com
# blocks automated fetch, so it cannot be ingested directly).

