# Guideline corpus manifest — the committed record of what the local corpus
# contains and where every document came from.
#
# The corpus files themselves are NOT committed (they are third-party
# copyrighted content, fetched locally for research/educational use).
# Rebuild the corpus and the pgvector store with:
#
#     uv run python scripts/ingest_guidelines.py
#
# Coverage is deliberately scoped to the mock-consultation test cases:
# chest pain / stable angina, dyspepsia, dengue, asthma, type 2 diabetes.

corpus_name: "Starter guideline corpus (UK NICE + CDC/WHO dengue)"
corpus_version: "2026-07-07.2"

sources:
