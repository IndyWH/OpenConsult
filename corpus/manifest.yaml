  # No NICE guideline for giant cell arteritis exists. The BSR guideline
  # (Mackie et al., Rheumatology 2020;59:e1-e23, doi:10.1093/rheumatology/
  # kez672) is the UK standard, but academic.oup.com blocks automated
  # fetch (403) and the BSR site only links back there, so the full text
  # cannot be ingested. The NICE CKS topic below is written from and
  # cites that BSR guideline — ingested as its retrievable equivalent.
