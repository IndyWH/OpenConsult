# Personality presets — named bundles of SeedChemistry + affinity.
# Each personality overrides species defaults for specific chemicals.

[default]
default_affinity = 1.0
interaction_scale = 1.0

[cheerful]
default_affinity = 1.2
interaction_scale = 1.0

[cheerful.baselines]
serotonin = 0.6
dopamine = 0.4
endorphins = 0.3
gaba = 0.45

[stoic]
default_affinity = 0.6
interaction_scale = 0.7

[stoic.baselines]
gaba = 0.6
serotonin = 0.5
adrenaline = 0.08
cortisol = 0.15

[stoic.half_life_multipliers]
adrenaline = 0.7
cortisol = 0.8

[anxious]
default_affinity = 1.5
interaction_scale = 1.3

[anxious.baselines]
cortisol = 0.35
gaba = 0.25
adrenaline = 0.15
serotonin = 0.4

[anxious.half_life_multipliers]
cortisol = 1.5
gaba = 1.3

# [clinical] — Consultation AI's preset (NOT upstream; added 2026-07-28,
# Phase 7b). Started from [stoic] per the owner's brief: high GABA and
# serotonin baselines, near-zero adrenaline with shortened half-lives,
# damped reactivity throughout. A limited emotional range — a clinical
# presence, not an expressive companion. All numbers are conservative
# first guesses; the calibration pass against real use sets them properly.
# The hard per-muscle caps live in app/face.py, NOT here — the preset
# expresses the intent, the caps enforce it (belt and braces, brief §3).
[clinical]
default_affinity = 0.4     # stoic 0.6 — every injected impulse lands weaker
interaction_scale = 0.5    # stoic 0.7 — cross-chemical coupling damped

[clinical.baselines]
gaba = 0.7                 # stoic 0.6 — stronger calm brake on arousal
serotonin = 0.55           # stoic 0.5 — stable mood floor
adrenaline = 0.02          # stoic 0.08 — near-zero resting arousal
cortisol = 0.1             # stoic 0.15 — low resting stress
oxytocin = 0.25            # species 0.2 — slight resting warmth, so a
                           # neutral face reads attentive rather than flat

[clinical.half_life_multipliers]
adrenaline = 0.4           # stoic 0.7 — 3 min species half-life becomes 72 s.
                           # Deliberately the main damping mechanism: with
                           # interaction_scale at 0.5 the GABA->adrenaline
                           # interaction brake is also halved, so the decay
                           # itself has to carry the "arousal dies quickly"
                           # requirement rather than the cross-coupling.
cortisol = 0.6             # stoic 0.8 — stress spikes wash out sooner
testosterone = 0.7         # dominance-linked; decays faster toward baseline
